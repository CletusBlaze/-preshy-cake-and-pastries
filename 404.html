<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Preshy Cakes & Pastries</title>
    <link rel="icon" type="image/png" href="/transparent logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'DM Sans',sans-serif;background:#1b1b1b;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem}
        .container{max-width:500px}
        .logo{width:120px;margin:0 auto 2rem}
        h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,3.5rem);margin-bottom:0.5rem}
        h1 em{color:#c8a656;font-style:italic}
        p{color:#999;margin-bottom:2rem;font-size:1rem}
        .btn{display:inline-block;padding:0.9rem 2.2rem;background:#c8a656;color:#fff;text-decoration:none;font-size:0.85rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;border-radius:8px;transition:all 0.3s}
        .btn:hover{background:#fff;color:#1b1b1b}
    </style>
</head>
<body>
    <div class="container">
        <img src="/transparent logo.png" alt="Preshy Cakes" class="logo">
        <h1>Page Not <em>Found</em></h1>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="/" class="btn">Back to Home</a>
    </div>
</body>
</html>
