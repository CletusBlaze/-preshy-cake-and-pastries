<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 300" width="650" height="300">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7e98e"/>
      <stop offset="30%" style="stop-color:#d4af37"/>
      <stop offset="70%" style="stop-color:#f7e98e"/>
      <stop offset="100%" style="stop-color:#a67c00"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff8e1"/>
      <stop offset="100%" style="stop-color:#c8a656"/>
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7c5d4"/>
      <stop offset="100%" style="stop-color:#e8909c"/>
    </linearGradient>
    <linearGradient id="sweep" x1="-50%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0)"/>
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.7)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
      <animate attributeName="x1" values="-50%;250%" dur="4s" repeatCount="indefinite" begin="4s"/>
      <animate attributeName="x2" values="0%;300%" dur="4s" repeatCount="indefinite" begin="4s"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:0"/>
    </radialGradient>
    <filter id="gl">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#d4af37" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Glow plate behind cake -->
  <ellipse cx="325" cy="115" rx="70" ry="15" fill="url(#plate)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze" begin="1s"/>
  </ellipse>

  <!-- 3-TIER CAKE ILLUSTRATION -->
  <g filter="url(#shadow)" opacity="0">
    <!-- Plate/Stand -->
    <ellipse cx="325" cy="115" rx="55" ry="8" fill="none" stroke="url(#g1)" stroke-width="2"/>
    <rect x="315" y="115" width="20" height="12" fill="none" stroke="url(#g1)" stroke-width="1.5"/>
    <ellipse cx="325" cy="127" rx="22" ry="5" fill="none" stroke="url(#g1)" stroke-width="1.5"/>

    <!-- Bottom tier -->
    <rect x="285" y="85" width="80" height="30" rx="5" fill="none" stroke="url(#g1)" stroke-width="2"/>
    <!-- Drip detail -->
    <path d="M285,88 C290,95 295,92 300,96 C305,92 310,95 315,88" fill="none" stroke="url(#g2)" stroke-width="1" opacity="0.7"/>
    <path d="M335,88 C340,94 345,91 350,96 C355,92 360,95 365,88" fill="none" stroke="url(#g2)" stroke-width="1" opacity="0.7"/>

    <!-- Middle tier -->
    <rect x="298" y="58" width="54" height="27" rx="4" fill="none" stroke="url(#g1)" stroke-width="2"/>
    <!-- Decorative dots -->
    <circle cx="310" cy="71" r="2" fill="url(#g1)" opacity="0.6"/>
    <circle cx="325" cy="71" r="2" fill="url(#g1)" opacity="0.6"/>
    <circle cx="340" cy="71" r="2" fill="url(#g1)" opacity="0.6"/>

    <!-- Top tier -->
    <rect x="310" y="38" width="30" height="20" rx="4" fill="none" stroke="url(#g1)" stroke-width="2"/>

    <!-- Roses on cake -->
    <g transform="translate(315, 45)">
      <circle cx="0" cy="0" r="4" fill="none" stroke="url(#rose)" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="2" fill="url(#rose)" opacity="0.5"/>
    </g>
    <g transform="translate(335, 45)">
      <circle cx="0" cy="0" r="4" fill="none" stroke="url(#rose)" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="2" fill="url(#rose)" opacity="0.5"/>
    </g>
    <g transform="translate(325, 52)">
      <circle cx="0" cy="0" r="3" fill="none" stroke="url(#rose)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="url(#rose)" opacity="0.5"/>
    </g>

    <!-- Topper heart -->
    <path d="M325,22 C325,22 320,16 315,18 C310,20 310,26 325,34 C340,26 340,20 335,18 C330,16 325,22 325,22Z" fill="url(#g1)" opacity="0.9">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" begin="3.5s"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="2s" repeatCount="indefinite" begin="3.5s" additive="sum"/>
    </path>

    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze" begin="0.3s"/>
    <animateTransform attributeName="transform" type="translate" values="0 -20;0 0" dur="1.2s" fill="freeze" begin="0.3s" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </g>

  <!-- Curved text path: "EST. 2019" -->
  <path id="arcTop" d="M255,50 Q325,20 395,50" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="8" letter-spacing="3" fill="url(#g1)" opacity="0">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">EST. 2019</textPath>
    <animate attributeName="opacity" values="0;0.8" dur="0.6s" fill="freeze" begin="2.5s"/>
  </text>

  <!-- Left wheat stalk -->
  <g opacity="0" transform="translate(195, 90)">
    <path d="M30,50 C25,40 20,30 22,20 C24,10 28,5 30,0" fill="none" stroke="url(#g1)" stroke-width="1.2" stroke-linecap="round"/>
    <ellipse cx="22" cy="15" rx="6" ry="3" fill="none" stroke="url(#g1)" stroke-width="0.8" transform="rotate(-30 22 15)"/>
    <ellipse cx="24" cy="25" rx="6" ry="3" fill="none" stroke="url(#g1)" stroke-width="0.8" transform="rotate(-20 24 25)"/>
    <ellipse cx="26" cy="35" rx="6" ry="3" fill="none" stroke="url(#g1)" stroke-width="0.8" transform="rotate(-10 26 35)"/>
    <ellipse cx="35" cy="12" rx="6" ry="3" fill="none" stroke="url(#g1)" stroke-width="0.8" transform="rotate(30 35 12)"/>
    <ellipse cx="34" cy="22" rx="6" ry="3" fill="none" stroke="url(#g1)" stroke-width="0.8" transform="rotate(20 34 22)"/>
    <ellipse cx="33" cy="32" rx="6" ry="3" fill="none" stroke="url(#g1)" stroke-width="0.8" transform="rotate(10 33 32)"/>
    <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze" begin="1.8s"/>
  </g>

  <!-- Right wheat stalk -->
  <g opacity="0" transform="translate(420, 90) scale(-1,1) translate(-30,0)">
    <path d="M30,50 C25,40 20,30 22,20 C24,10 28,5 30,0" fill="none" stroke="url(#g1)" stroke-width="1.2" stroke-linecap="round"/>
    <ellipse cx="22" cy="15" rx="6" ry="3" fill="none" stroke="url(#g1)" stroke-width="0.8" transform="rotate(-30 22 15)"/>
    <ellipse cx="24" cy="25" rx="6" ry="3" fill="none" stroke="url(#g1)" stroke-width="0.8" transform="rotate(-20 24 25)"/>
    <ellipse cx="26" cy="35" rx="6" ry="3" fill="none" stroke="url(#g1)" stroke-width="0.8" transform="rotate(-10 26 35)"/>
    <ellipse cx="35" cy="12" rx="6" ry="3" fill="none" stroke="url(#g1)" stroke-width="0.8" transform="rotate(30 35 12)"/>
    <ellipse cx="34" cy="22" rx="6" ry="3" fill="none" stroke="url(#g1)" stroke-width="0.8" transform="rotate(20 34 22)"/>
    <ellipse cx="33" cy="32" rx="6" ry="3" fill="none" stroke="url(#g1)" stroke-width="0.8" transform="rotate(10 33 32)"/>
    <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze" begin="1.8s"/>
  </g>

  <!-- PRESHY script style - stroke draw -->
  <text x="325" y="175" text-anchor="middle" font-family="'Brush Script MT', 'Segoe Script', cursive" font-size="72" font-weight="400" fill="none" stroke="url(#g1)" stroke-width="1.2" stroke-dasharray="600" stroke-dashoffset="600">
    Preshy
    <animate attributeName="stroke-dashoffset" values="600;0" dur="2s" fill="freeze" begin="1s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </text>

  <!-- PRESHY fill -->
  <text x="325" y="175" text-anchor="middle" font-family="'Brush Script MT', 'Segoe Script', cursive" font-size="72" font-weight="400" fill="#ffffff" opacity="0">
    Preshy
    <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze" begin="2.5s"/>
  </text>

  <!-- Shimmer sweep -->
  <text x="325" y="175" text-anchor="middle" font-family="'Brush Script MT', 'Segoe Script', cursive" font-size="72" font-weight="400" fill="url(#sweep)" opacity="0">
    Preshy
    <animate attributeName="opacity" values="0;0.7" dur="0.3s" fill="freeze" begin="4s"/>
  </text>

  <!-- Decorative line left of subtext -->
  <line x1="180" y1="195" x2="260" y2="195" stroke="url(#g1)" stroke-width="0.8" opacity="0" stroke-dasharray="80" stroke-dashoffset="80">
    <animate attributeName="stroke-dashoffset" values="80;0" dur="0.6s" fill="freeze" begin="2.8s"/>
    <animate attributeName="opacity" values="0;0.7" dur="0.3s" fill="freeze" begin="2.8s"/>
  </line>

  <!-- Decorative line right of subtext -->
  <line x1="390" y1="195" x2="470" y2="195" stroke="url(#g1)" stroke-width="0.8" opacity="0" stroke-dasharray="80" stroke-dashoffset="80">
    <animate attributeName="stroke-dashoffset" values="-80;0" dur="0.6s" fill="freeze" begin="2.8s"/>
    <animate attributeName="opacity" values="0;0.7" dur="0.3s" fill="freeze" begin="2.8s"/>
  </line>

  <!-- Diamond center -->
  <polygon points="325,191 329,195 325,199 321,195" fill="url(#g1)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="3s"/>
    <animateTransform attributeName="transform" type="rotate" values="0 325 195;360 325 195" dur="10s" repeatCount="indefinite" begin="3.5s"/>
  </polygon>

  <!-- CAKES & PASTRIES -->
  <text x="325" y="220" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="10" fill="url(#g1)" opacity="0">
    CAKES &amp; PASTRIES
    <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze" begin="3s"/>
    <animateTransform attributeName="transform" type="translate" values="0 5;0 0" dur="0.5s" fill="freeze" begin="3s"/>
  </text>

  <!-- Curved bottom flourish -->
  <path d="M220,238 C250,245 280,250 325,245 C370,240 400,245 430,238" fill="none" stroke="url(#g1)" stroke-width="1" opacity="0" stroke-dasharray="230" stroke-dashoffset="230">
    <animate attributeName="stroke-dashoffset" values="230;0" dur="1s" fill="freeze" begin="3.3s"/>
    <animate attributeName="opacity" values="0;0.6" dur="0.3s" fill="freeze" begin="3.3s"/>
  </path>

  <!-- Tagline -->
  <text x="325" y="265" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="4" fill="rgba(255,255,255,0.45)" opacity="0">
    LUXURY BAKING · EVENT CATERING · LAGOS
    <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze" begin="3.5s"/>
  </text>

  <!-- Animated sparkles/stars -->
  <g filter="url(#gl)">
    <circle cx="180" cy="60" r="1.5" fill="#f7e98e" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="4s"/>
      <animate attributeName="r" values="1;2.5;1" dur="2s" repeatCount="indefinite" begin="4s"/>
    </circle>
    <circle cx="470" cy="55" r="1.8" fill="#f7e98e" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite" begin="4.3s"/>
    </circle>
    <circle cx="155" cy="140" r="1.2" fill="#f7e98e" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="1.8s" repeatCount="indefinite" begin="4.5s"/>
    </circle>
    <circle cx="495" cy="145" r="1.4" fill="#f7e98e" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite" begin="4.1s"/>
    </circle>
    <circle cx="200" cy="200" r="1" fill="#f7e98e" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="1.6s" repeatCount="indefinite" begin="4.7s"/>
    </circle>
    <circle cx="450" cy="210" r="1.3" fill="#f7e98e" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.1s" repeatCount="indefinite" begin="4.2s"/>
    </circle>
    <circle cx="260" cy="40" r="0.9" fill="#f7e98e" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.9s" repeatCount="indefinite" begin="4.4s"/>
    </circle>
    <circle cx="390" cy="35" r="1.1" fill="#f7e98e" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="2.3s" repeatCount="indefinite" begin="4.6s"/>
    </circle>
    <circle cx="145" cy="180" r="0.8" fill="#f7e98e" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="2s" repeatCount="indefinite" begin="4.8s"/>
    </circle>
    <circle cx="505" cy="185" r="1" fill="#f7e98e" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1.7s" repeatCount="indefinite" begin="4.3s"/>
    </circle>
  </g>

  <!-- Floating tiny hearts -->
  <g opacity="0">
    <path d="M170,75 C170,73 168,72 166,73 C164,74 164,76 170,80 C176,76 176,74 174,73 C172,72 170,73 170,75Z" fill="url(#rose)" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;-5 -10;0 0" dur="4s" repeatCount="indefinite" begin="4.5s"/>
    </path>
    <path d="M480,80 C480,78 478,77 476,78 C474,79 474,81 480,85 C486,81 486,79 484,78 C482,77 480,78 480,80Z" fill="url(#rose)" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="0 0;5 -8;0 0" dur="3.5s" repeatCount="indefinite" begin="4.8s"/>
    </path>
    <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="4.5s"/>
  </g>
</svg>
